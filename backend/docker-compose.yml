services:
  postgres:
    image: postgres:17-alpine
    container_name: basilico-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-basilico_db}
      POSTGRES_USER: ${DB_USER:-basilico}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - basilico-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-basilico} -d ${DB_NAME:-basilico_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  basilico-postgres-data:
