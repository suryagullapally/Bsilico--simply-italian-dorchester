server:
  port: 8080
  error:
    include-binding-errors: never
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: basilico-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:basilico_db}
    username: ${DB_USER:basilico}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
