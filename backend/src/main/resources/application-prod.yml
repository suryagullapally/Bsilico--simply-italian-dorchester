server:
  servlet:
    session:
      timeout: ${ADMIN_SESSION_TIMEOUT:8h}
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}${DB_JDBC_PARAMETERS:}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

basilico:
  cors:
    allowed-origins: ${BASILICO_CORS_ALLOWED_ORIGINS:}
  payments:
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      customer-web-base-url: ${CUSTOMER_WEB_BASE_URL:}
    manual-payment-status:
      enabled: ${BASILICO_ALLOW_MANUAL_PAYMENT_STATUS:false}
  notifications:
    email:
      from-email: ${MAIL_FROM_EMAIL:}
      from-name: ${MAIL_FROM_NAME:Basilico - Simple Italian}
      worker-enabled: ${MAIL_WORKER_ENABLED:true}
  delivery:
    postcodes-io:
      base-url: ${POSTCODES_IO_BASE_URL:https://api.postcodes.io}
      timeout-ms: ${POSTCODES_IO_TIMEOUT_MS:2500}
      cache-ttl-seconds: ${POSTCODES_IO_CACHE_TTL_SECONDS:86400}
      cache-max-entries: ${POSTCODES_IO_CACHE_MAX_ENTRIES:500}
    openrouteservice:
      api-key: ${OPENROUTESERVICE_API_KEY:}
      base-url: ${OPENROUTESERVICE_BASE_URL:https://api.heigit.org/openrouteservice}
      timeout-ms: ${OPENROUTESERVICE_TIMEOUT_MS:3500}
      cache-ttl-seconds: ${OPENROUTESERVICE_CACHE_TTL_SECONDS:900}
      cache-max-entries: ${OPENROUTESERVICE_CACHE_MAX_ENTRIES:500}
