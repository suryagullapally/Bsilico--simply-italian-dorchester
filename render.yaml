services:
  - type: web
    name: basilico-backend
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    rootDir: backend
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAME_SITE
        value: lax
      - key: ADMIN_SESSION_TIMEOUT
        value: 8h
      - key: BASILICO_ALLOW_MANUAL_PAYMENT_STATUS
        value: "false"
      - key: DB_HOST
        fromDatabase:
          name: basilico-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: basilico-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: basilico-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: basilico-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: basilico-postgres
          property: password
      - key: DB_JDBC_PARAMETERS
        sync: false
      - key: BASILICO_CORS_ALLOWED_ORIGINS
        sync: false
      - key: CUSTOMER_WEB_BASE_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: OPENROUTESERVICE_API_KEY
        sync: false
      - key: BASILICO_ADMIN_EMAIL
        sync: false
      - key: BASILICO_ADMIN_PASSWORD
        sync: false
      - key: BASILICO_ADMIN_DISPLAY_NAME
        sync: false
      - key: MAIL_WORKER_ENABLED
        value: "false"
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        sync: false

databases:
  - name: basilico-postgres
    region: frankfurt
    plan: 0.1c-256mb
    databaseName: basilico_db
    user: basilico
    postgresMajorVersion: "17"
